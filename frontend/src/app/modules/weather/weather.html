@if (weatherdata(); as weather) {
  <div class="weathercomponent">
    <div class="city">
      <p>{{ cityname() }}</p>
    </div>
    <div class="icon">
      <img [src]="getIconPath(weather.current.weather_code, weather.current.is_day)" alt="" />
    </div>
    <div class="data">
      <div class="currentTemperature">
        <img class="smallIcons" src="icons/thermometer-celsius.svg" alt="" />
        <p class="text">Aktuelle Temperatur: {{ weather.current.temperature_2m }}</p>
      </div>
      <div class="maxTemperature">
        <img class="smallIcons" src="icons/thermometer-warmer.svg" alt="" />
        <p class="text">Maximale Temperatur: {{ weather.daily.temperature_2m_max }}</p>
      </div>
      <div class="minTemperature">
        <img class="smallIcons" src="icons/thermometer-colder.svg" alt="" />
        <p class="text">Minimale Temperatur: {{ weather.daily.temperature_2m_min }}</p>
      </div>
    </div>
  </div>
}
